<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>fotasso</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#ffffff; --ink:#171717; --muted:#8c8c86;
    --accent:#9eff1f; --accent-ink:#171717;
    --surface:#f6f6f1; --surface-2:#ecece4;
    --ok:#2f9e44; --warn:#c9740a; --danger:#e5484d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}

  #topbar{
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; justify-content:space-between; align-items:center;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
    pointer-events:none;
  }
  #topbar > *{pointer-events:auto;}
  .pill{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--surface-2); border-radius:999px; padding:7px 13px; font-size:12px; color:var(--muted);}
  .pill.ok{color:var(--ok);}
  .pill.warn{color:var(--warn);}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .icon-btn{width:36px;height:36px;border-radius:50%; border:1px solid var(--surface-2); background:var(--surface); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:16px;}

  #stage{position:relative; flex:1; display:flex; align-items:center; justify-content:center; padding:0 5vw;}
  #camFrame{
    position:relative; height:min(84vh, 84vw/1.3358); aspect-ratio:899/673; width:auto;
    border-radius:22px; overflow:hidden; background:#000;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
  }
  video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1);}
  #flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:15;}
  #countdownNum{
    position:absolute; inset:0; z-index:12; display:flex; align-items:center; justify-content:center;
    font-size:24vmin; font-weight:800; color:#fff; text-shadow:0 6px 30px rgba(0,0,0,.55);
    opacity:0; transform:scale(.7); pointer-events:none;
  }
  #logoPill{
    position:absolute; z-index:14; top:10px; left:50%; transform:translateX(-50%);
    background:#fff; border-radius:999px; padding:5px 14px; box-shadow:0 3px 12px rgba(0,0,0,.18);
    display:flex; align-items:center;
  }
  #logoPill img{height:20px; width:auto; display:block;}
  #toast{
    position:absolute; z-index:16; bottom:16px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.74); color:#fff; padding:9px 18px; border-radius:999px;
    font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; white-space:nowrap;
  }
  #toast.show{opacity:1;}

  #shutter{
    position:fixed; z-index:20; right:3.2vw; top:50%; transform:translateY(-50%);
    width:74px; height:74px; background:var(--ink); border:none;
    clip-path:polygon(50.00% 0.00%, 61.28% 26.57%, 89.09% 18.83%, 75.35% 44.21%, 98.75% 61.13%, 70.33% 66.21%, 71.69% 95.05%, 50.00% 76.00%, 28.31% 95.05%, 29.67% 66.21%, 1.25% 61.13%, 24.65% 44.21%, 10.91% 18.83%, 38.72% 26.57%);
  }
  #shutter:active{transform:translateY(-50%) scale(.92);}
  #shutter[disabled]{opacity:.4;}

  .screen{position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--bg); padding:24px; text-align:center; gap:16px;}
  .hidden{display:none !important;}
  h1{font-size:19px; font-weight:700; margin:0;}
  p{color:var(--muted); font-size:14px; line-height:1.5; margin:0; max-width:320px;}
  .btn{appearance:none; border:none; border-radius:14px; padding:14px 22px; font-size:15px; font-weight:700; color:var(--accent-ink); background:var(--accent); min-width:220px;}
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:var(--surface); color:var(--ink); border:1px solid var(--surface-2);}
  .btn[disabled]{opacity:.5;}

  #settings{position:absolute; inset:0; z-index:40; background:rgba(0,0,0,.35); display:flex; align-items:flex-end;}
  #settings.hidden{display:none;}
  #settingsCard{width:100%; background:var(--bg); border-radius:20px 20px 0 0; padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px); max-height:80vh; overflow:auto; box-shadow:0 -8px 30px rgba(0,0,0,.15);}
  .field{margin-bottom:18px; text-align:left;}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:8px;}
  .segmented{display:flex; gap:8px;}
  .segmented button{flex:1; padding:10px; border-radius:10px; border:1px solid var(--surface-2); background:var(--surface); color:var(--muted); font-size:13px;}
  .segmented button.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  input[type=number], input[type=text]{width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--surface-2); background:var(--surface); color:var(--ink); font-size:15px;}
  .row{display:flex; align-items:center; justify-content:space-between;}
  .switch{width:46px; height:26px; border-radius:999px; background:var(--surface-2); position:relative; border:1px solid var(--surface-2);}
  .switch.on{background:var(--accent);}
  .switch::after{content:"";position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s; box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch.on::after{left:22px;}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <button id="btPill" class="pill warn"><span class="dot"></span><span id="btPillText">Impressora não conectada</span></button>
    <div style="display:flex; gap:8px;">
      <button id="fullscreenBtn" class="icon-btn" title="Tela cheia">⛶</button>
      <button id="gearBtn" class="icon-btn">⚙️</button>
    </div>
  </div>

  <div id="stage">
    <div id="camFrame">
      <video id="video" autoplay playsinline muted></video>
      <div id="flash"></div>
      <div id="countdownNum"></div>
      <div id="logoPill"><img src="logo-fotasso.png" alt="fotasso" /></div>
      <div id="toast"></div>
    </div>
  </div>

  <button id="shutter" aria-label="Iniciar"></button>

  <div id="screenCamError" class="screen hidden">
    <h1>Não consegui acessar a câmera</h1>
    <p id="camErrorMsg">Verifique se você permitiu o acesso à câmera e se está abrindo esta página pelo Chrome.</p>
    <button class="btn" onclick="initCamera()">Tentar de novo</button>
  </div>

  <div id="settings" class="hidden">
    <div id="settingsCard">
      <h1 style="margin-bottom:18px;">Ajustes</h1>

      <div class="field">
        <label>Impressora</label>
        <button id="connectBtn" class="btn secondary" style="width:100%;">Conectar impressora</button>
      </div>

      <div class="field">
        <label>Largura do papel (px, múltiplo de 8)</label>
        <input type="number" id="paperWidthInput" step="8" min="128" max="960" value="384" />
      </div>

      <div class="field">
        <label>Intensidade de impressão</label>
        <div class="segmented" id="qualitySeg">
          <button data-v="24">Clara</button>
          <button data-v="51" class="active">Normal</button>
          <button data-v="90">Escura</button>
        </div>
      </div>

      <div class="field row">
        <label style="margin:0;">Som</label>
        <div class="switch on" id="soundSwitch"></div>
      </div>

      <div class="field row">
        <label style="margin:0;">Câmera frontal</label>
        <div class="switch on" id="cameraSwitch"></div>
      </div>

      <div class="field">
        <label>Google Client ID (Google Cloud Console)</label>
        <input type="text" id="gClientIdInput" placeholder="xxxxxxxxxx.apps.googleusercontent.com" />
      </div>

      <div class="field">
        <label>Google Drive</label>
        <button id="connectDriveBtn" class="btn secondary" style="width:100%;">Conectar Google Drive</button>
        <p id="driveConnectStatus" style="margin-top:8px;">Não conectado</p>
      </div>

      <button class="btn secondary" style="width:100%;" id="closeSettingsBtn">Fechar</button>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     PROTOCOLO BLUETOOTH (impressoras "cat printer" / GB0x / MX0x)
     Pacote: [0x51,0x78, CMD, 0x00, lenLo, lenHi, ...dados, crc8, 0xFF]
     ============================================================ */
  const SERVICE_UUID = '0000ae30-0000-1000-8000-00805f9b34fb';
  const CHAR_WRITE_UUID = '0000ae01-0000-1000-8000-00805f9b34fb';
  const CHAR_NOTIFY_UUID = '0000ae02-0000-1000-8000-00805f9b34fb';
  const CMD = { SET_QUALITY:0xA4, SET_ENERGY:0xAF, SET_MODE:0xBE, DRAW_LINE:0xA2, FEED_PAPER:0xA1 };

  function crc8(bytes){
    let crc = 0;
    for (const b of bytes){
      crc ^= b;
      for (let i=0;i<8;i++) crc = (crc & 0x80) ? ((crc<<1)^0x07) & 0xFF : (crc<<1) & 0xFF;
    }
    return crc & 0xFF;
  }
  function buildPacket(cmd, data){
    data = data || [];
    const len = data.length;
    return new Uint8Array([0x51,0x78, cmd & 0xFF, 0x00, len & 0xFF, (len>>8) & 0xFF, ...data, crc8(data), 0xFF]);
  }
  const sleep = (ms) => new Promise(r=>setTimeout(r,ms));

  /* ============================================================
     FOTO / IMPRESSÃO — só a foto crua + data no canto
     ============================================================ */
  const PRINT_W = 899, PRINT_H = 673;      // mesmo enquadramento da prévia da câmera
  const PHOTO_ASPECT = PRINT_W / PRINT_H;
  const CAPTURE_W = 1348, CAPTURE_H = Math.round(CAPTURE_W/PHOTO_ASPECT);

  if (document.fonts) document.fonts.load('700 40px "Caveat"').catch(()=>{});

  /* ============================================================
     ESTADO
     ============================================================ */
  const settings = { paperWidth:384, quality:51, sound:true, frontCamera:true, gClientId: localStorage.getItem('gClientId') || '' };
  const state = { busy:false, stream:null };
  let btDevice=null, btServer=null, writeChar=null;
  let gDriveToken=null, gDriveTokenExpiry=0, gDriveFolderId=localStorage.getItem('gDriveFolderId') || null;

  /* ============================================================
     ELEMENTOS
     ============================================================ */
  const $ = (id)=>document.getElementById(id);
  const video=$('video'), flashEl=$('flash'), countdownNum=$('countdownNum'), toast=$('toast');
  const shutter=$('shutter');
  const screenCamError=$('screenCamError'), camErrorMsg=$('camErrorMsg');
  const btPill=$('btPill'), btPillText=$('btPillText'), connectBtn=$('connectBtn');
  const gearBtn=$('gearBtn'), settingsPanel=$('settings'), closeSettingsBtn=$('closeSettingsBtn');
  const fullscreenBtn=$('fullscreenBtn');
  const paperWidthInput=$('paperWidthInput'), qualitySeg=$('qualitySeg');
  const soundSwitch=$('soundSwitch'), cameraSwitch=$('cameraSwitch');
  const gClientIdInput=$('gClientIdInput'), connectDriveBtn=$('connectDriveBtn'), driveConnectStatus=$('driveConnectStatus');
  gClientIdInput.value = settings.gClientId;

  /* ============================================================
     TOAST (status rapido, sem sair da camera)
     ============================================================ */
  let toastTimer=null;
  function setToastText(text){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
  }
  function showToast(text, ms){
    setToastText(text);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), ms||2200);
  }

  /* ============================================================
     ÁUDIO
     ============================================================ */
  let audioCtx=null;
  function beep(freq, dur){
    if (!settings.sound) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.frequency.value = freq; osc.type = 'sine';
      gain.gain.setValueAtTime(.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur/1000);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur/1000);
    }catch(e){}
  }

  /* ============================================================
     CÂMERA
     ============================================================ */
  window.initCamera = async function initCamera(){
    screenCamError.classList.add('hidden');
    try{
      if (state.stream) state.stream.getTracks().forEach(t=>t.stop());
      const stream = await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{ facingMode: settings.frontCamera ? 'user' : 'environment', width:{ideal:1280}, height:{ideal:1280} }
      });
      state.stream = stream;
      video.srcObject = stream;
      video.style.transform = settings.frontCamera ? 'scaleX(-1)' : 'none';
      await video.play().catch(()=>{});
    }catch(err){
      camErrorMsg.textContent = 'Verifique se você permitiu o acesso à câmera e se está abrindo esta página pelo Chrome. (' + (err && err.message ? err.message : err) + ')';
      screenCamError.classList.remove('hidden');
    }
  };

  /* ============================================================
     CAPTURA + IMPRESSÃO
     ============================================================ */
  function captureFrame(targetW, targetH){
    const vw = video.videoWidth, vh = video.videoHeight;
    const targetAspect = targetW/targetH;
    const srcAspect = vw/vh;
    let sx,sy,sw,sh;
    if (srcAspect > targetAspect){ sh=vh; sw=vh*targetAspect; sx=(vw-sw)/2; sy=0; }
    else { sw=vw; sh=vw/targetAspect; sx=0; sy=(vh-sh)/2; }
    const c = document.createElement('canvas');
    c.width = targetW; c.height = targetH;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    if (settings.frontCamera){ ctx.translate(targetW,0); ctx.scale(-1,1); }
    ctx.drawImage(video, sx,sy,sw,sh, 0,0,targetW,targetH);
    return c;
  }

  // foto crua (para o Drive) — sem nenhum texto ou moldura
  function cropToPrintSize(photoCanvas){
    const c = document.createElement('canvas');
    c.width = PRINT_W; c.height = PRINT_H;
    const cctx = c.getContext('2d');
    cctx.imageSmoothingEnabled = true;
    cctx.imageSmoothingQuality = 'high';
    cctx.drawImage(photoCanvas, 0, 0, PRINT_W, PRINT_H);
    return c;
  }

  // foto + data no canto, só isso (pro impresso)
  function buildPrintCanvas(photoCanvas){
    const c = cropToPrintSize(photoCanvas);
    const ctx = c.getContext('2d');
    const now = new Date();
    const dataStr = String(now.getDate()).padStart(2,'0') + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + now.getFullYear();
    ctx.font = '700 54px "Caveat", system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.lineWidth = 12;
    ctx.strokeText(dataStr, PRINT_W-24, PRINT_H-22);
    ctx.fillStyle = '#000';
    ctx.fillText(dataStr, PRINT_W-24, PRINT_H-22);
    return c;
  }

  // O cabeçote imprime numa largura FIXA (384px = 57mm); a foto é
  // "deitada", então giramos 90° e escalamos pra caber no rolo.
  function buildPrintRaster(printCanvas, paperWidthPx){
    const scale = paperWidthPx / printCanvas.height;
    const scaledW = Math.round(printCanvas.width*scale);
    const scaledH = paperWidthPx;
    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = scaledH; finalCanvas.height = scaledW;
    const ctx = finalCanvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,finalCanvas.width, finalCanvas.height);
    ctx.save();
    ctx.translate(finalCanvas.width, 0);
    ctx.rotate(Math.PI/2);
    ctx.drawImage(printCanvas, 0, 0, scaledW, scaledH);
    ctx.restore();
    return finalCanvas;
  }

  // Dithering Atkinson (espalha só 3/4 do erro, em vez de 100% como o
  // Floyd-Steinberg) — produz um resultado bem mais limpo em impressoras
  // térmicas de baixa resolução, com menos listras/padrões repetidos
  function toBitmapRows(canvas, widthPx){
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const img = ctx.getImageData(0,0,w,h);
    const gray = new Float32Array(w*h);
    for (let i=0;i<w*h;i++){
      const r=img.data[i*4], g=img.data[i*4+1], b=img.data[i*4+2];
      gray[i] = 0.299*r + 0.587*g + 0.114*b;
    }
    // suaviza o ruído da câmera (reduz a textura "de estática" no
    // impresso) e clareia um pouco o meio-tom antes do dithering
    const blurred = new Float32Array(w*h);
    for (let y=0;y<h;y++){
      for (let x=0;x<w;x++){
        let sum=0, n=0;
        for (let dy=-1; dy<=1; dy++){
          const yy=y+dy; if (yy<0||yy>=h) continue;
          for (let dx=-1; dx<=1; dx++){
            const xx=x+dx; if (xx<0||xx>=w) continue;
            sum += gray[yy*w+xx]; n++;
          }
        }
        blurred[y*w+x] = Math.min(255, (sum/n)*1.22 + 14);
      }
    }
    gray.set(blurred);
    for (let y=0;y<h;y++){
      for (let x=0;x<w;x++){
        const idx = y*w+x, old = gray[idx];
        const nv = old < 128 ? 0 : 255;
        const err = (old - nv) / 8;
        gray[idx] = nv;
        if (x+1<w) gray[idx+1] += err;
        if (x+2<w) gray[idx+2] += err;
        if (y+1<h){
          if (x>0) gray[idx+w-1] += err;
          gray[idx+w] += err;
          if (x+1<w) gray[idx+w+1] += err;
        }
        if (y+2<h) gray[idx+2*w] += err;
      }
    }
    const bytesPerRow = widthPx/8;
    const rows = [];
    for (let y=0;y<h;y++){
      const row = new Uint8Array(bytesPerRow);
      for (let bx=0; bx<bytesPerRow; bx++){
        let byte=0;
        for (let bit=0; bit<8; bit++){
          const x = bx*8+bit;
          byte |= (gray[y*w+x] < 128 ? 1:0) << (7-bit);
        }
        row[bx]=byte;
      }
      rows.push(row);
    }
    return rows;
  }

  async function runCountdown(seconds){
    for (let s=seconds; s>=1; s--){
      countdownNum.textContent = s;
      countdownNum.style.transition = 'none';
      countdownNum.style.opacity = '0'; countdownNum.style.transform = 'scale(.7)';
      void countdownNum.offsetWidth;
      countdownNum.style.transition = 'opacity .18s, transform .18s';
      countdownNum.style.opacity = '1'; countdownNum.style.transform = 'scale(1)';
      beep(760, 90);
      await sleep(1000);
    }
    countdownNum.style.opacity = '0';
  }

  function doFlash(){
    flashEl.style.transition = 'none';
    flashEl.style.opacity = '1';
    requestAnimationFrame(()=>{
      flashEl.style.transition = 'opacity .35s';
      flashEl.style.opacity = '0';
    });
  }

  async function startSession(){
    if (state.busy) return;
    state.busy = true;
    shutter.disabled = true;

    await runCountdown(3);
    const rawPhoto = captureFrame(CAPTURE_W, CAPTURE_H);
    doFlash();
    beep(1300, 70);

    // Drive roda em paralelo, sem travar a impressão nem trocar de tela
    const drivePromise = settings.gClientId
      ? uploadPhotoToDrive(cropToPrintSize(rawPhoto)).then(()=>true).catch(()=>false)
      : Promise.resolve(null);

    setToastText('Preparando…');
    const printCanvas = buildPrintCanvas(rawPhoto);
    const raster = buildPrintRaster(printCanvas, settings.paperWidth);
    const rows = toBitmapRows(raster, settings.paperWidth);

    if (btDevice){
      try{
        await ensureConnected();
        await doPrint(rows);
        setToastText('Impressa! 🎉');
      }catch(err){
        setToastText('Falha ao imprimir 😕');
      }
    } else {
      setToastText('Impressora não conectada');
    }

    const driveOk = await drivePromise;
    if (driveOk === true) setToastText((toast.textContent) + ' · Salva no Drive ✅');
    else if (driveOk === false) setToastText((toast.textContent) + ' · Drive falhou');
    showToast(toast.textContent, 2800);

    state.busy = false;
    shutter.disabled = false;
  }

  /* ============================================================
     BLUETOOTH
     ============================================================ */
  function setBtStatus(kind, text){
    btPill.classList.remove('ok','warn');
    btPill.classList.add(kind === 'ok' ? 'ok' : 'warn');
    btPillText.textContent = text;
  }

  // O Chrome no Android às vezes "capenga" logo após conectar — a conexão
  // cai antes de conseguir listar os serviços. Tentar de novo quase sempre resolve.
  async function ensureConnected(){
    if (!btDevice) throw new Error('sem dispositivo');
    if (btDevice.gatt.connected && writeChar){
      setBtStatus('ok', btDevice.name || 'Impressora conectada');
      return;
    }
    let lastErr;
    for (let attempt=1; attempt<=3; attempt++){
      try{
        btServer = await btDevice.gatt.connect();
        await sleep(250); // deixa a conexão estabilizar antes de listar os serviços
        const service = await btServer.getPrimaryService(SERVICE_UUID);
        writeChar = await service.getCharacteristic(CHAR_WRITE_UUID);
        try{
          const notifyChar = await service.getCharacteristic(CHAR_NOTIFY_UUID);
          await notifyChar.startNotifications();
        }catch(e){}
        setBtStatus('ok', btDevice.name || 'Impressora conectada');
        return;
      }catch(err){
        lastErr = err;
        try{ btDevice.gatt.disconnect(); }catch(e){}
        await sleep(400*attempt);
      }
    }
    throw lastErr;
  }

  async function connectPrinter(){
    if (!navigator.bluetooth){
      alert('Este navegador não suporta Bluetooth Web. Abra esta página no Chrome do Android.');
      return;
    }
    try{
      const device = await navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices:[SERVICE_UUID] });
      btDevice = device;
      device.addEventListener('gattserverdisconnected', ()=> setBtStatus('warn', 'Impressora desconectada'));
      await ensureConnected();
    }catch(err){
      if (err && err.name !== 'NotFoundError') alert('Não consegui conectar: ' + (err && err.message ? err.message : err));
    }
  }

  async function sendPacket(bytes){
    if (writeChar.writeValueWithoutResponse) await writeChar.writeValueWithoutResponse(bytes);
    else await writeChar.writeValue(bytes);
  }

  // linhas mais espaçadas: evita corromper/"falhar" a imagem por
  // sobrecarregar o buffer da impressora
  async function doPrint(rows){
    await sendPacket(buildPacket(CMD.SET_QUALITY, [settings.quality]));
    await sleep(30);
    await sendPacket(buildPacket(CMD.SET_ENERGY, [0xE0, 0x2E]));
    await sleep(30);
    await sendPacket(buildPacket(CMD.SET_MODE, [0x00]));
    await sleep(40);
    for (let i=0;i<rows.length;i++){
      await sendPacket(buildPacket(CMD.DRAW_LINE, Array.from(rows[i])));
      await sleep(26);
      if (i % 40 === 0) await sleep(30); // respiro extra pro buffer a cada ~40 linhas
      setToastText('Imprimindo… ' + Math.round(((i+1)/rows.length)*100) + '%');
    }
    await sendPacket(buildPacket(CMD.FEED_PAPER, [0x80, 0x00]));
  }

  /* ============================================================
     GOOGLE DRIVE
     ============================================================ */
  function setDriveConnectStatus(text){ driveConnectStatus.textContent = text; }

  function requestDriveToken(promptOption){
    return new Promise((resolve, reject)=>{
      if (!window.google || !google.accounts || !google.accounts.oauth2){
        reject(new Error('Google Identity Services ainda não carregou.')); return;
      }
      if (!settings.gClientId){ reject(new Error('Cole o Google Client ID nos ajustes primeiro.')); return; }
      try{
        const client = google.accounts.oauth2.initTokenClient({
          client_id: settings.gClientId,
          scope: 'https://www.googleapis.com/auth/drive.file',
          callback: (resp)=>{
            if (resp && resp.access_token){
              gDriveToken = resp.access_token;
              gDriveTokenExpiry = Date.now() + ((resp.expires_in||3300)*1000 - 60000);
              resolve(gDriveToken);
            } else reject(new Error('Não recebi um token de acesso do Google.'));
          },
          error_callback: (err)=> reject(err && err.message ? err : new Error('Falha na autenticação do Google.')),
        });
        client.requestAccessToken(promptOption ? { prompt: promptOption } : {});
      }catch(e){ reject(e); }
    });
  }

  async function ensureDriveToken(){
    if (gDriveToken && Date.now() < gDriveTokenExpiry) return gDriveToken;
    return requestDriveToken('');
  }

  async function ensureDriveFolder(token){
    if (gDriveFolderId) return gDriveFolderId;
    const q = encodeURIComponent("name='Photobooth' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    const res = await fetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)', { headers:{ Authorization:'Bearer ' + token } });
    const data = await res.json();
    if (data.files && data.files.length){
      gDriveFolderId = data.files[0].id;
    } else {
      const createRes = await fetch('https://www.googleapis.com/drive/v3/files', {
        method:'POST',
        headers:{ Authorization:'Bearer ' + token, 'Content-Type':'application/json' },
        body: JSON.stringify({ name:'Photobooth', mimeType:'application/vnd.google-apps.folder' })
      });
      gDriveFolderId = (await createRes.json()).id;
    }
    localStorage.setItem('gDriveFolderId', gDriveFolderId);
    return gDriveFolderId;
  }

  // sobe a foto crua (sem data, sem moldura) — cópia digital limpa
  async function uploadPhotoToDrive(canvas){
    const token = await ensureDriveToken();
    const folderId = await ensureDriveFolder(token);
    const blob = await new Promise(res=> canvas.toBlob(res, 'image/png'));
    const metadata = { name:'photobooth-' + Date.now() + '.png', parents:[folderId] };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], {type:'application/json'}));
    form.append('file', blob);
    const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
      method:'POST', headers:{ Authorization:'Bearer ' + token }, body: form
    });
    if (!res.ok) throw new Error('Drive respondeu ' + res.status);
    return res.json();
  }

  connectDriveBtn.addEventListener('click', async ()=>{
    settings.gClientId = gClientIdInput.value.trim();
    if (!settings.gClientId){ alert('Cole o Google Client ID antes de conectar.'); return; }
    localStorage.setItem('gClientId', settings.gClientId);
    setDriveConnectStatus('Conectando…');
    try{
      await requestDriveToken();
      await ensureDriveFolder(gDriveToken);
      setDriveConnectStatus('Conectado — salvando na pasta "Photobooth" do seu Drive ✅');
    }catch(err){
      setDriveConnectStatus('Falha: ' + (err && err.message ? err.message : err));
    }
  });

  /* ============================================================
     LIGAÇÕES DE UI
     ============================================================ */
  function requestFullscreenOnce(){
    try{
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    }catch(e){}
  }
  fullscreenBtn.addEventListener('click', requestFullscreenOnce);

  shutter.addEventListener('click', startSession);
  gearBtn.addEventListener('click', ()=> settingsPanel.classList.remove('hidden'));
  closeSettingsBtn.addEventListener('click', ()=> settingsPanel.classList.add('hidden'));
  btPill.addEventListener('click', ()=> settingsPanel.classList.remove('hidden'));
  connectBtn.addEventListener('click', connectPrinter);

  paperWidthInput.addEventListener('change', ()=>{
    let v = parseInt(paperWidthInput.value, 10) || 384;
    v = Math.max(128, Math.min(960, Math.round(v/8)*8));
    paperWidthInput.value = v;
    settings.paperWidth = v;
  });

  qualitySeg.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      qualitySeg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      settings.quality = parseInt(btn.dataset.v, 10);
    });
  });

  soundSwitch.addEventListener('click', ()=>{
    settings.sound = !settings.sound;
    soundSwitch.classList.toggle('on', settings.sound);
  });
  cameraSwitch.addEventListener('click', ()=>{
    settings.frontCamera = !settings.frontCamera;
    cameraSwitch.classList.toggle('on', settings.frontCamera);
    initCamera();
  });

  /* ============================================================
     INÍCIO
     ============================================================ */
  initCamera();
})();
</script>
