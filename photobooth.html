<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#050505" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>Photobooth</title>
<style>
  :root{
    --bg:#050505;
    --surface:#17140f;
    --surface-2:#221d15;
    --accent:#ffc145;      /* âmbar/flash */
    --accent-2:#ff5a36;    /* laranja energia */
    --text:#f6f3ea;
    --text-muted:#9c978a;
    --ok:#7cc576;
    --danger:#e5484d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column;}

  /* ---------- topo ---------- */
  #topbar{
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; justify-content:space-between; align-items:center;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 12px;
    pointer-events:none;
  }
  #topbar > *{pointer-events:auto;}
  .pill{
    display:flex; align-items:center; gap:6px;
    background:rgba(0,0,0,.45); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px; padding:8px 14px; font-size:13px; color:var(--text-muted);
  }
  .pill.ok{color:var(--ok);}
  .pill.warn{color:var(--accent-2);}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;}
  .icon-btn{
    width:40px;height:40px;border-radius:50%; border:1px solid rgba(255,255,255,.14);
    background:rgba(0,0,0,.45); backdrop-filter:blur(6px); color:var(--text);
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }

  /* ---------- câmera ---------- */
  #camWrap{position:relative; flex:1; overflow:hidden; background:#000;}
  video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    transform:scaleX(-1);
  }
  #flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:15;}

  #countdownNum{
    position:absolute; inset:0; z-index:12;
    display:flex; align-items:center; justify-content:center;
    font-size:42vw; font-weight:800; color:#fff;
    text-shadow:0 6px 40px rgba(0,0,0,.6);
    opacity:0; transform:scale(.7);
    pointer-events:none;
  }
  #shotBadge{
    position:absolute; z-index:12; top:16px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.5); border-radius:999px; padding:6px 16px; font-size:13px;
    letter-spacing:.02em; color:var(--text-muted); display:none;
  }

  /* ---------- botão obturador ---------- */
  #shutterWrap{
    position:absolute; z-index:20; left:0; right:0; bottom:0;
    display:flex; justify-content:center;
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
    padding-top:26px;
    background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0));
  }
  #shutter{
    width:84px; height:84px; border-radius:50%;
    background:var(--accent);
    border:5px solid rgba(255,255,255,.85);
    box-shadow:0 6px 26px rgba(255,193,69,.45);
  }
  #shutter:active{transform:scale(.93);}
  #shutter[disabled]{opacity:.5;}

  /* ---------- telas auxiliares ---------- */
  .screen{
    position:absolute; inset:0; z-index:30;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg); padding:24px; text-align:center; gap:16px;
  }
  .hidden{display:none !important;}
  h1{font-size:20px; font-weight:700; margin:0;}
  p{color:var(--text-muted); font-size:15px; line-height:1.5; margin:0; max-width:320px;}

  .btn{
    appearance:none; border:none; border-radius:14px; padding:14px 22px;
    font-size:15px; font-weight:600; color:#181510; background:var(--accent);
    min-width:220px;
  }
  .btn:active{transform:scale(.97);}
  .btn.secondary{background:var(--surface-2); color:var(--text); border:1px solid rgba(255,255,255,.12);}
  .btn.ghost{background:transparent; color:var(--text-muted); border:1px solid rgba(255,255,255,.14);}
  .btn[disabled]{opacity:.5;}

  #stripPreview{max-width:78vw; max-height:52vh; border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,.5); background:#fff;}

  .progressBar{width:240px; height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden;}
  .progressBar > div{height:100%; width:0%; background:var(--accent); transition:width .15s;}

  /* ---------- settings ---------- */
  #settings{position:absolute; inset:0; z-index:40; background:rgba(0,0,0,.6); display:flex; align-items:flex-end;}
  #settings.hidden{display:none;}
  #settingsCard{
    width:100%; background:var(--surface); border-radius:20px 20px 0 0;
    padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px); max-height:80vh; overflow:auto;
  }
  .field{margin-bottom:18px; text-align:left;}
  .field label{display:block; font-size:13px; color:var(--text-muted); margin-bottom:8px;}
  .segmented{display:flex; gap:8px;}
  .segmented button{
    flex:1; padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,.14);
    background:var(--surface-2); color:var(--text-muted); font-size:13px;
  }
  .segmented button.active{background:var(--accent); color:#181510; border-color:var(--accent);}
  input[type=number]{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,255,255,.14);
    background:var(--surface-2); color:var(--text); font-size:15px;
  }
  .row{display:flex; align-items:center; justify-content:space-between;}
  .switch{width:46px; height:26px; border-radius:999px; background:var(--surface-2); position:relative; border:1px solid rgba(255,255,255,.14);}
  .switch.on{background:var(--accent);}
  .switch::after{content:"";position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .15s;}
  .switch.on::after{left:22px;}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <button id="btPill" class="pill warn">
      <span class="dot"></span>
      <span id="btPillText">Impressora não conectada</span>
    </button>
    <div style="display:flex; gap:8px;">
      <button id="fullscreenBtn" class="icon-btn" title="Tela cheia">⛶</button>
      <button id="gearBtn" class="icon-btn">⚙️</button>
    </div>
  </div>

  <div id="camWrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="flash"></div>
    <div id="shotBadge"></div>
    <div id="countdownNum"></div>
  </div>

  <div id="shutterWrap">
    <button id="shutter" aria-label="Iniciar"></button>
  </div>

  <!-- tela: câmera indisponível -->
  <div id="screenCamError" class="screen hidden">
    <h1>Não consegui acessar a câmera</h1>
    <p id="camErrorMsg">Verifique se você permitiu o acesso à câmera e se está abrindo esta página pelo Chrome.</p>
    <button class="btn" onclick="initCamera()">Tentar de novo</button>
  </div>

  <!-- tela: processando -->
  <div id="screenProcessing" class="screen hidden">
    <h1>Revelando a tira…</h1>
    <div class="progressBar"><div id="processingBar"></div></div>
  </div>

  <!-- tela: revisão / impressão -->
  <div id="screenReview" class="screen hidden">
    <img id="stripPreview" alt="Tira de fotos" />
    <div id="reviewStatus"><p>Pronta!</p></div>
    <div class="progressBar hidden" id="printProgressWrap"><div id="printProgressBar"></div></div>
    <button id="printBtn" class="btn">🖨️ Imprimir</button>
    <button id="downloadBtn" class="btn secondary">⬇️ Baixar imagem</button>
    <button id="newSessionBtn" class="btn ghost">Nova sessão</button>
  </div>

  <!-- settings -->
  <div id="settings" class="hidden">
    <div id="settingsCard">
      <h1 style="margin-bottom:18px;">Ajustes</h1>

      <div class="field">
        <label>Impressora</label>
        <button id="connectBtn" class="btn secondary" style="width:100%;">Conectar impressora</button>
      </div>

      <div class="field">
        <label>Largura do papel (px, múltiplo de 8)</label>
        <input type="number" id="paperWidthInput" step="8" min="128" max="960" value="384" />
      </div>

      <div class="field">
        <label>Intensidade de impressão</label>
        <div class="segmented" id="qualitySeg">
          <button data-v="24">Clara</button>
          <button data-v="51" class="active">Normal</button>
          <button data-v="90">Escura</button>
        </div>
      </div>

      <div class="field row">
        <label style="margin:0;">Som</label>
        <div class="switch on" id="soundSwitch"></div>
      </div>

      <div class="field row">
        <label style="margin:0;">Câmera frontal</label>
        <div class="switch on" id="cameraSwitch"></div>
      </div>

      <button class="btn secondary" style="width:100%;" id="closeSettingsBtn">Fechar</button>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     PROTOCOLO BLUETOOTH (impressoras "cat printer" / GB0x / MX0x)
     Baseado em engenharia reversa pública do protocolo usado pelo
     app iPrint com esse chip. Pacote:
     [0x51,0x78, CMD, 0x00, lenLo, lenHi, ...dados, crc8(dados), 0xFF]
     ============================================================ */
  const SERVICE_UUID = '0000ae30-0000-1000-8000-00805f9b34fb';
  const CHAR_WRITE_UUID = '0000ae01-0000-1000-8000-00805f9b34fb';
  const CHAR_NOTIFY_UUID = '0000ae02-0000-1000-8000-00805f9b34fb';
  const CMD = { SET_QUALITY:0xA4, SET_ENERGY:0xAF, SET_MODE:0xBE, DRAW_LINE:0xA2, FEED_PAPER:0xA1 };

  function crc8(bytes){
    let crc = 0;
    for (const b of bytes){
      crc ^= b;
      for (let i=0;i<8;i++){
        crc = (crc & 0x80) ? ((crc<<1)^0x07) & 0xFF : (crc<<1) & 0xFF;
      }
    }
    return crc & 0xFF;
  }
  function buildPacket(cmd, data){
    data = data || [];
    const len = data.length;
    return new Uint8Array([0x51,0x78, cmd & 0xFF, 0x00, len & 0xFF, (len>>8) & 0xFF, ...data, crc8(data), 0xFF]);
  }
  const sleep = (ms) => new Promise(r=>setTimeout(r,ms));

  /* ============================================================
     ESTADO
     ============================================================ */
  const settings = { paperWidth:384, quality:51, sound:true, frontCamera:true };
  const state = { busy:false, stream:null };
  let btDevice=null, btServer=null, writeChar=null;
  let lastRows=null;

  /* ============================================================
     ELEMENTOS
     ============================================================ */
  const $ = (id)=>document.getElementById(id);
  const video=$('video'), flashEl=$('flash'), countdownNum=$('countdownNum'), shotBadge=$('shotBadge');
  const shutter=$('shutter');
  const screenCamError=$('screenCamError'), camErrorMsg=$('camErrorMsg');
  const screenProcessing=$('screenProcessing'), processingBar=$('processingBar');
  const screenReview=$('screenReview'), stripPreview=$('stripPreview');
  const printBtn=$('printBtn'), downloadBtn=$('downloadBtn'), newSessionBtn=$('newSessionBtn');
  const printProgressWrap=$('printProgressWrap'), printProgressBar=$('printProgressBar');
  const reviewStatus=$('reviewStatus');
  const btPill=$('btPill'), btPillText=$('btPillText'), connectBtn=$('connectBtn');
  const gearBtn=$('gearBtn'), settingsPanel=$('settings'), closeSettingsBtn=$('closeSettingsBtn');
  const fullscreenBtn=$('fullscreenBtn');
  const paperWidthInput=$('paperWidthInput'), qualitySeg=$('qualitySeg');
  const soundSwitch=$('soundSwitch'), cameraSwitch=$('cameraSwitch');

  function showScreen(el){
    [screenCamError,screenProcessing,screenReview].forEach(s=>s.classList.add('hidden'));
    if (el) el.classList.remove('hidden');
  }

  /* ============================================================
     ÁUDIO (bipes sintetizados, sem depender de arquivos externos)
     ============================================================ */
  let audioCtx=null;
  function beep(freq, dur){
    if (!settings.sound) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur/1000);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur/1000);
    }catch(e){}
  }

  /* ============================================================
     CÂMERA
     ============================================================ */
  window.initCamera = async function initCamera(){
    showScreen(null);
    try{
      if (state.stream) state.stream.getTracks().forEach(t=>t.stop());
      const stream = await navigator.mediaDevices.getUserMedia({
        audio:false,
        video:{ facingMode: settings.frontCamera ? 'user' : 'environment', width:{ideal:1280}, height:{ideal:1280} }
      });
      state.stream = stream;
      video.srcObject = stream;
      video.style.transform = settings.frontCamera ? 'scaleX(-1)' : 'none';
      await video.play().catch(()=>{});
    }catch(err){
      camErrorMsg.textContent = 'Verifique se você permitiu o acesso à câmera e se está abrindo esta página pelo Chrome. (' + (err && err.message ? err.message : err) + ')';
      showScreen(screenCamError);
    }
  };

  /* ============================================================
     CAPTURA E MONTAGEM DA TIRA
     ============================================================ */
  function captureFrame(targetW, targetH){
    const vw = video.videoWidth, vh = video.videoHeight;
    const targetAspect = targetW/targetH;
    const srcAspect = vw/vh;
    let sx,sy,sw,sh;
    if (srcAspect > targetAspect){ sh=vh; sw=vh*targetAspect; sx=(vw-sw)/2; sy=0; }
    else { sw=vw; sh=vw/targetAspect; sx=0; sy=(vh-sh)/2; }
    const c = document.createElement('canvas');
    c.width = targetW; c.height = targetH;
    const ctx = c.getContext('2d');
    if (settings.frontCamera){
      ctx.translate(targetW,0); ctx.scale(-1,1); // espelha p/ bater com a prévia
    }
    ctx.drawImage(video, sx,sy,sw,sh, 0,0,targetW,targetH);
    return c;
  }

  function buildStripCanvas(photoCanvases, widthPx){
    const sideMargin = 8, gap = 16, topMargin = 40, bottomFeed = 74, captionH = 30;
    const photoW = widthPx - sideMargin*2;
    const photoH = Math.round(photoW*1.25);
    const n = photoCanvases.length;
    const totalH = topMargin + n*photoH + (n-1)*gap + captionH + bottomFeed;

    const strip = document.createElement('canvas');
    strip.width = widthPx; strip.height = totalH;
    const ctx = strip.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,widthPx,totalH);

    let y = topMargin;
    photoCanvases.forEach((pc, idx)=>{
      ctx.drawImage(pc, sideMargin, y, photoW, photoH);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      ctx.strokeRect(sideMargin, y, photoW, photoH);
      y += photoH;
      if (idx < n-1){
        const midY = y + gap/2;
        ctx.save();
        ctx.setLineDash([6,6]);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(sideMargin, midY); ctx.lineTo(widthPx-sideMargin, midY); ctx.stroke();
        ctx.restore();
        y += gap;
      }
    });

    ctx.fillStyle = '#000';
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(new Date().toLocaleDateString('pt-BR'), widthPx/2, y + captionH - 6);

    return strip;
  }

  // Dithering Floyd–Steinberg + empacotamento em bits (1 = queima/preto)
  function toBitmapRows(canvas, widthPx){
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const img = ctx.getImageData(0,0,w,h);
    const gray = new Float32Array(w*h);
    for (let i=0;i<w*h;i++){
      const r=img.data[i*4], g=img.data[i*4+1], b=img.data[i*4+2];
      gray[i] = 0.299*r + 0.587*g + 0.114*b;
    }
    for (let y=0;y<h;y++){
      for (let x=0;x<w;x++){
        const idx = y*w+x;
        const old = gray[idx];
        const nv = old < 128 ? 0 : 255;
        const err = old - nv;
        gray[idx] = nv;
        if (x+1<w) gray[idx+1] += err*7/16;
        if (y+1<h){
          if (x>0) gray[idx+w-1] += err*3/16;
          gray[idx+w] += err*5/16;
          if (x+1<w) gray[idx+w+1] += err*1/16;
        }
      }
    }
    const bytesPerRow = widthPx/8;
    const rows = [];
    for (let y=0;y<h;y++){
      const row = new Uint8Array(bytesPerRow);
      for (let bx=0; bx<bytesPerRow; bx++){
        let byte=0;
        for (let bit=0; bit<8; bit++){
          const x = bx*8+bit;
          const black = gray[y*w+x] < 128 ? 1:0;
          byte |= black << (7-bit);
        }
        row[bx]=byte;
      }
      rows.push(row);
    }
    return rows;
  }

  /* ============================================================
     SEQUÊNCIA DE CAPTURA
     ============================================================ */
  async function runCountdown(seconds){
    for (let s=seconds; s>=1; s--){
      countdownNum.textContent = s;
      countdownNum.style.transition = 'none';
      countdownNum.style.opacity = '0'; countdownNum.style.transform = 'scale(.7)';
      // força reflow p/ reiniciar animação
      void countdownNum.offsetWidth;
      countdownNum.style.transition = 'opacity .18s, transform .18s';
      countdownNum.style.opacity = '1'; countdownNum.style.transform = 'scale(1)';
      beep(760, 90);
      await sleep(1000);
    }
    countdownNum.style.opacity = '0';
  }

  function doFlash(){
    flashEl.style.transition = 'none';
    flashEl.style.opacity = '1';
    requestAnimationFrame(()=>{
      flashEl.style.transition = 'opacity .35s';
      flashEl.style.opacity = '0';
    });
  }

  async function startSession(){
    if (state.busy) return;
    state.busy = true;
    shutter.disabled = true;
    const shots = [];
    const sideMargin = 8;
    const photoW = settings.paperWidth - sideMargin*2;
    const photoH = Math.round(photoW*1.25);

    shotBadge.style.display = 'block';
    for (let i=0;i<3;i++){
      shotBadge.textContent = 'Foto ' + (i+1) + ' de 3';
      await runCountdown(3);
      const frame = captureFrame(photoW, photoH);
      doFlash();
      beep(1300, 70);
      shots.push(frame);
      await sleep(650);
    }
    shotBadge.style.display = 'none';

    showScreen(screenProcessing);
    processingBar.style.width = '30%';
    await sleep(30);
    const strip = buildStripCanvas(shots, settings.paperWidth);
    processingBar.style.width = '65%';
    await sleep(20);
    const rows = toBitmapRows(strip, settings.paperWidth);
    lastRows = rows;
    processingBar.style.width = '100%';
    await sleep(150);

    stripPreview.src = strip.toDataURL('image/png');
    printProgressWrap.classList.add('hidden');
    printProgressBar.style.width='0%';
    showScreen(screenReview);

    if (btDevice){
      try{
        await ensureConnected();
        reviewStatus.innerHTML = '<p>Imprimindo automaticamente…</p>';
        await doPrint(rows);
        reviewStatus.innerHTML = '<p>Impressa! 🎉</p>';
      }catch(err){
        reviewStatus.innerHTML = '<p>Não consegui imprimir automaticamente. Toque em Imprimir para tentar de novo.</p>';
      }
    } else {
      reviewStatus.innerHTML = '<p>Impressora não conectada — toque em Imprimir.</p>';
    }

    state.busy = false;
    shutter.disabled = false;
  }

  /* ============================================================
     BLUETOOTH
     ============================================================ */
  function setBtStatus(kind, text){
    btPill.classList.remove('ok','warn');
    btPill.classList.add(kind === 'ok' ? 'ok' : 'warn');
    btPillText.textContent = text;
  }

  async function ensureConnected(){
    if (!btDevice) throw new Error('sem dispositivo');
    if (!btDevice.gatt.connected){
      btServer = await btDevice.gatt.connect();
      const service = await btServer.getPrimaryService(SERVICE_UUID);
      writeChar = await service.getCharacteristic(CHAR_WRITE_UUID);
      try{
        const notifyChar = await service.getCharacteristic(CHAR_NOTIFY_UUID);
        await notifyChar.startNotifications();
      }catch(e){ /* opcional, ignora se não existir */ }
    }
    setBtStatus('ok', btDevice.name || 'Impressora conectada');
  }

  async function connectPrinter(){
    if (!navigator.bluetooth){
      alert('Este navegador não suporta Bluetooth Web. Abra esta página no Chrome do Android.');
      return;
    }
    try{
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices:true,
        optionalServices:[SERVICE_UUID]
      });
      btDevice = device;
      device.addEventListener('gattserverdisconnected', ()=>{
        setBtStatus('warn', 'Impressora desconectada');
      });
      await ensureConnected();
    }catch(err){
      if (err && err.name !== 'NotFoundError'){
        alert('Não consegui conectar: ' + (err && err.message ? err.message : err));
      }
    }
  }

  async function sendPacket(bytes){
    if (writeChar.writeValueWithoutResponse){
      await writeChar.writeValueWithoutResponse(bytes);
    } else {
      await writeChar.writeValue(bytes);
    }
  }

  async function doPrint(rows){
    printProgressWrap.classList.remove('hidden');
    printBtn.disabled = true;
    await sendPacket(buildPacket(CMD.SET_QUALITY, [settings.quality]));
    await sleep(30);
    await sendPacket(buildPacket(CMD.SET_ENERGY, [0xE0, 0x2E]));
    await sleep(30);
    await sendPacket(buildPacket(CMD.SET_MODE, [0x00]));
    await sleep(30);
    for (let i=0;i<rows.length;i++){
      await sendPacket(buildPacket(CMD.DRAW_LINE, Array.from(rows[i])));
      await sleep(16);
      printProgressBar.style.width = Math.round(((i+1)/rows.length)*100) + '%';
    }
    await sendPacket(buildPacket(CMD.FEED_PAPER, [0x80, 0x00]));
    printBtn.disabled = false;
  }

  /* ============================================================
     TELA CHEIA (some com a barra de endereço do Chrome)
     ============================================================ */
  function requestFullscreenOnce(){
    try{
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen){
        el.requestFullscreen().catch(()=>{});
      }
    }catch(e){}
  }

  /* ============================================================
     LIGAÇÕES DE UI
     ============================================================ */
  shutter.addEventListener('click', ()=>{ requestFullscreenOnce(); startSession(); });
  fullscreenBtn.addEventListener('click', requestFullscreenOnce);

  gearBtn.addEventListener('click', ()=> settingsPanel.classList.remove('hidden'));
  closeSettingsBtn.addEventListener('click', ()=> settingsPanel.classList.add('hidden'));
  btPill.addEventListener('click', ()=> settingsPanel.classList.remove('hidden'));
  connectBtn.addEventListener('click', connectPrinter);

  paperWidthInput.addEventListener('change', ()=>{
    let v = parseInt(paperWidthInput.value, 10) || 384;
    v = Math.max(128, Math.min(960, Math.round(v/8)*8));
    paperWidthInput.value = v;
    settings.paperWidth = v;
  });

  qualitySeg.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      qualitySeg.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      settings.quality = parseInt(btn.dataset.v, 10);
    });
  });

  soundSwitch.addEventListener('click', ()=>{
    settings.sound = !settings.sound;
    soundSwitch.classList.toggle('on', settings.sound);
  });
  cameraSwitch.addEventListener('click', ()=>{
    settings.frontCamera = !settings.frontCamera;
    cameraSwitch.classList.toggle('on', settings.frontCamera);
    initCamera();
  });

  printBtn.addEventListener('click', async ()=>{
    if (!lastRows) return;
    try{
      if (!btDevice) await connectPrinter();
      if (!btDevice) return;
      reviewStatus.innerHTML = '<p>Imprimindo…</p>';
      await ensureConnected();
      await doPrint(lastRows);
      reviewStatus.innerHTML = '<p>Impressa! 🎉</p>';
    }catch(err){
      reviewStatus.innerHTML = '<p>Falha ao imprimir: ' + (err && err.message ? err.message : err) + '</p>';
    }
  });

  downloadBtn.addEventListener('click', ()=>{
    const a = document.createElement('a');
    a.href = stripPreview.src;
    a.download = 'photobooth-' + Date.now() + '.png';
    document.body.appendChild(a); a.click(); a.remove();
  });

  newSessionBtn.addEventListener('click', ()=>{ showScreen(null); });

  /* ============================================================
     INÍCIO
     ============================================================ */
  initCamera();
})();
</script>
</body>
</html>
